<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiTimer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="sticky-controls">
        <header class="app-header">
          <div class="brand">
            <p class="eyebrow">
              <span>MultiTimer</span>
              <span class="version-badge">v1.2.2</span>
            </p>
            <h1 data-i18n="app.title">Мульти таймери</h1>
          </div>

          <div class="app-controls">
            <label class="select-control" for="languageSelect">
              <span data-i18n="controls.language">Мова</span>
              <select id="languageSelect">
                <option value="uk">UA</option>
                <option value="en">EN</option>
              </select>
            </label>
            <button class="secondary-button" id="notificationsButton" type="button" aria-pressed="false">
              <span data-i18n="controls.notificationsEnable">Увімкнути сповіщення</span>
            </button>
            <button class="primary-button" id="addTimerButton" type="button">
              <span data-i18n="controls.addTimer">Додати таймер</span>
            </button>
          </div>
        </header>

        <section class="control-panel" aria-label="Налаштування таймерів" data-i18n-aria-label="sections.timerSettings">
          <div class="sort-controls">
            <label class="toggle-control" for="autoSortToggle">
              <input id="autoSortToggle" type="checkbox" />
              <span data-i18n="controls.autoSort">Автосортування</span>
            </label>
            <button class="secondary-button" id="sortNowButton" type="button">
              <span data-i18n="controls.sortNow">Сортувати</span>
            </button>
            <label class="select-control" for="sortDirectionSelect">
              <span data-i18n="controls.direction">Напрям</span>
              <select id="sortDirectionSelect">
                <option value="asc" data-i18n="sort.asc">Менші зверху</option>
                <option value="desc" data-i18n="sort.desc">Більші зверху</option>
              </select>
            </label>
            <label class="number-control" for="warningMinutes">
              <span data-i18n="controls.warningMinutes">Попередження, хв</span>
              <input id="warningMinutes" type="number" min="1" max="1440" step="1" inputmode="numeric" />
            </label>
          </div>

          <div class="audio-controls">
            <label class="volume-control" for="volumeRange">
              <span data-i18n="controls.volume">Гучність</span>
              <output id="volumeValue" for="volumeRange">55%</output>
              <input id="volumeRange" type="range" min="0" max="100" step="1" />
            </label>
            <button class="secondary-button" id="muteButton" type="button" aria-pressed="false">
              Mute
            </button>
            <label class="select-control" for="ringtoneSelect">
              <span data-i18n="controls.ringtone">Рингтон</span>
              <select id="ringtoneSelect">
                <option value="classic" data-i18n="ringtone.classic">Старий будильник</option>
                <option value="digital" data-i18n="ringtone.digital">Цифровий</option>
                <option value="soft" data-i18n="ringtone.soft">М'який</option>
              </select>
            </label>
            <label class="number-control" for="alarmDurationSeconds">
              <span data-i18n="controls.alarmSeconds">Сигнал, с</span>
              <input id="alarmDurationSeconds" type="number" min="1" max="60" step="1" inputmode="numeric" />
            </label>
            <button class="secondary-button" id="testAlarmButton" type="button">
              <span data-i18n="controls.test">Тест</span>
            </button>
          </div>
        </section>
      </div>

      <section class="timer-board" aria-label="Список таймерів" data-i18n-aria-label="sections.timerList">
        <div class="empty-state" id="emptyState">
          <h2 data-i18n="empty.title">Таймерів ще немає</h2>
        </div>
        <div class="timer-list" id="timerList"></div>
      </section>

      <footer class="app-footer">
        <button class="danger-button" id="clearAllButton" type="button">
          <span data-i18n="controls.clearAll">Очистити всі таймери</span>
        </button>
      </footer>
    </main>

    <template id="timerTemplate">
      <article class="timer-row">
        <button class="drag-handle" type="button" aria-label="Перемістити таймер" data-i18n-aria-label="timer.move">
          ⋮⋮
        </button>
        <button class="icon-button star-button timer-star-button" type="button" aria-label="Додати в обране" data-i18n-aria-label="timer.addStar">
          ☆
        </button>
        <button class="icon-button delete-button timer-delete-button" type="button" aria-label="Видалити таймер" data-i18n-aria-label="timer.delete">
          ×
        </button>

        <div class="timer-top">
          <div class="timer-title-cell">
            <input class="timer-title" type="text" aria-label="Назва таймера" data-i18n-aria-label="timer.titleInput" spellcheck="false" autocomplete="off" />
          </div>

          <div class="timer-count-cell">
            <div class="timer-time" aria-live="polite">00:00:00</div>
          </div>

        </div>

        <div class="timer-second-row">
          <div class="timer-actions">
            <button class="secondary-button pause-button" type="button" data-i18n="timer.pause">Зупинити</button>
            <button class="secondary-button reset-button" type="button" data-i18n="timer.reset">Скинути</button>
            <button class="secondary-button next-day-button" type="button" data-i18n="timer.nextDay">Наступний день</button>
            <button class="secondary-button deactivate-button" type="button" data-i18n="timer.deactivate">Деактивувати</button>
            <button class="secondary-button edit-button" type="button" data-i18n="timer.edit">Редагувати</button>
          </div>
        </div>

        <div class="timer-meta" aria-label="Дані таймера" data-i18n-aria-label="timer.data">
          <div class="meta-row target-block">
            <span class="meta-label" data-i18n="timer.target">Ціль</span>
            <time class="target-time">--:--</time>
          </div>
          <div class="meta-row meta-summary">
            <span class="mode-value" aria-label="Режим" data-i18n-aria-label="timer.modeAria">--</span>
            <span class="meta-divider" aria-hidden="true"></span>
            <span class="meta-label" data-i18n="timer.setTo">Задано</span>
            <span class="set-value">--</span>
          </div>
        </div>
      </article>
    </template>

    <dialog class="timer-dialog" id="timerDialog">
      <form class="timer-form" id="timerForm">
        <div class="dialog-header">
          <h2 id="dialogTitle" data-i18n="dialog.editTitle">Редагувати</h2>
          <button class="icon-button" id="dialogCloseButton" type="button" aria-label="Закрити" data-i18n-aria-label="dialog.close">
            ×
          </button>
        </div>

        <label class="field">
          <span data-i18n="dialog.name">Назва</span>
          <input id="editTitle" type="text" maxlength="120" autocomplete="off" />
        </label>

        <fieldset class="mode-switch">
          <legend data-i18n="dialog.timeFormat">Формат часу</legend>
          <label>
            <input type="radio" name="timerMode" value="duration" />
            <span data-i18n="dialog.duration">Тривалість</span>
          </label>
          <label>
            <input type="radio" name="timerMode" value="targetTime" />
            <span data-i18n="dialog.targetTime">Цільовий час</span>
          </label>
        </fieldset>

        <div class="field mode-field" id="durationField">
          <span id="durationTimeLabel" data-i18n="dialog.durationTime">Тривалість</span>
          <div class="time-inputs" role="group" aria-labelledby="durationTimeLabel">
            <input id="editDurationHours" type="text" inputmode="numeric" maxlength="4" pattern="\d{1,4}" aria-label="Години" data-i18n-aria-label="dialog.hours" placeholder="4" />
            <span aria-hidden="true">:</span>
            <input id="editDurationMinutes" type="text" inputmode="numeric" maxlength="6" pattern="\d{1,6}" aria-label="Хвилини" data-i18n-aria-label="dialog.minutesField" placeholder="00" />
          </div>
        </div>

        <div class="field mode-field" id="targetTimeField">
          <label class="subfield" for="editTargetDate">
            <span data-i18n="dialog.date">Дата</span>
            <span class="date-input-row">
              <input id="editTargetDate" type="text" inputmode="numeric" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" autocomplete="off" placeholder="yyyy-mm-dd" />
              <button class="secondary-button date-picker-button" id="targetDatePickerButton" type="button" aria-label="Відкрити календар" data-i18n-aria-label="dialog.openCalendar">...</button>
              <input class="date-picker-input" id="editTargetDatePicker" type="date" tabindex="-1" aria-hidden="true" />
            </span>
          </label>

          <div class="subfield">
            <span id="targetTimeLabel" data-i18n="dialog.finishTime">Час завершення</span>
            <div class="time-inputs" role="group" aria-labelledby="targetTimeLabel">
              <input id="editTargetHours" type="text" inputmode="numeric" maxlength="2" pattern="([01]?[0-9]|2[0-4])" aria-label="Години" data-i18n-aria-label="dialog.hours" placeholder="18" />
              <span aria-hidden="true">:</span>
              <input id="editTargetMinutes" type="text" inputmode="numeric" maxlength="2" pattern="[0-5]?[0-9]" aria-label="Хвилини" data-i18n-aria-label="dialog.minutesField" placeholder="00" />
            </div>
          </div>
        </div>

        <div class="dialog-actions">
          <button class="danger-button" id="deleteEditButton" type="button" data-i18n="dialog.delete">Видалити</button>
          <button class="secondary-button" id="cancelEditButton" type="button" data-i18n="dialog.cancel">Скасувати</button>
          <button class="primary-button" type="submit" data-i18n="dialog.save">Зберегти</button>
        </div>
      </form>
    </dialog>

    <script src="src/app.js" defer></script>
  </body>
</html>
